# Longer run, same recipe as seed1 but ~3.75x the data: 60k English rows, 1 pass = 3,750 optimizer steps.
# Validation every 250 steps on the same fixed 1,000 rows as seed1 (so curves are comparable); best/ = lowest val NLL, synced to the Hub at each checkpoint.
# Run data-parallel on both T4s:  torchrun --nproc_per_node=2 -m src.train --config configs/seed1_long.yaml
# (16 rows/step = 2 GPUs x 2 micro-batches x 4 rows; identical maths to one GPU, ~1.9x faster). Smaller: --set max_rows=32000.
run_id: seed1_long
seed: 1
dtype: fp16
max_rows: 60000
batch_size: 4
accumulation: 4
lr: 2.0e-4
readout_lr: 1.0e-4
warmup_steps: 50
eval_every: 250
save_every: 200
eval_rows: 1000
